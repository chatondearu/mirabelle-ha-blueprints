  - if:
      - condition: template
        value_template: "{{ package_exists and not force_overwrite_value }}"
    then:
      - stop: LAL profile presets already exist
    else:
      - service: shell_command.cda_write_living_area_lighting_helper_package
        data:
          package_filename: "{{ package_filename_resolved | string }}"
          content_b64: "{{ package_b64 | string }}"
        continue_on_error: true
      - service: homeassistant.reload_all
        continue_on_error: true
      - delay:
          seconds: 5
      - variables:
          package_exists_after: "{{ states(probe_entity) not in ['unknown', 'unavailable', ''] }}"
      - if:
          - condition: template
            value_template: "{{ package_exists_after }}"
        then:
          - service: persistent_notification.create
            data:
              title: "[CDA] LAL Profile Presets"
              message: >
                Created profile preset helpers (starlight_blue, ember_red, soft_day).
                Select a preset in each Living Area Adaptive Lighting automation.
        else:
          - service: persistent_notification.create
            data:
              title: "[CDA] LAL Profile Presets"
              message: >
                Preset package write failed. Ensure
                shell_command.cda_write_living_area_lighting_helper_package exists
                (see docs/living-area-adaptive-lighting.md).
