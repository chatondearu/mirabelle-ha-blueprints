            min: 1
            max: 100
            step: 1
            initial: 15
            unit_of_measurement: "%"
            mode: box
          lal_preset_starlight_blue_morning_kelvin_min:
            name: "LAL Starlight Blue Morning Kelvin Min"
            min: 2000
            max: 6500
            step: 50
            initial: 2500
            unit_of_measurement: K
            mode: box
