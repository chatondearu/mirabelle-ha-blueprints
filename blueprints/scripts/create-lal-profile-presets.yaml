blueprint:
  homeassistant:
    min_version: 2025.5.3
  name: "[CDA] 🛋️ Create LAL Profile Presets"
  description: >
    Create shared Living Area Lighting profile presets as a Home Assistant
    package (input_number / input_select helpers). Edit values in the UI, then
    select a preset from each Living Area Adaptive Lighting automation.
    Requires shell_command.cda_write_living_area_lighting_helper_package
    (same as the mode/hold helper script).
  domain: script
  source_url: https://github.com/chatondearu/mirabelle-ha-blueprints/blob/main/blueprints/scripts/create-lal-profile-presets.yaml
  input:
    package_filename:
      name: Package Filename
      description: Filename written under /config/packages/.
      default: cda_lal_profile_presets.yaml
      selector:
        text: {}
    force_overwrite:
      name: Force Overwrite
      description: >
        When enabled, rewrite the package even if preset helpers already exist.
        Use after upgrading preset definitions.
      default: false
      selector:
        boolean: {}

mode: single
sequence:
  - variables:
      package_filename_value: !input package_filename
      force_overwrite_value: !input force_overwrite
      probe_entity: input_number.lal_preset_starlight_blue_night_hue
      package_exists: "{{ states(probe_entity) not in ['unknown', 'unavailable', ''] }}"
      package_filename_resolved: "{{ package_filename_value }}"
      package_b64: |
        {% set pkg -%}
        # Generated by [CDA] Create LAL Profile Presets
        # Profile values only (not schedule / privacy). Edit in UI, select from LAL.
        input_select:
          lal_preset_starlight_blue_animation:
            name: "LAL Preset Starlight Blue Animation"
            options:
              - "none"
              - leaf_cloud
            initial: leaf_cloud
            icon: mdi:weather-night
          lal_preset_ember_red_animation:
            name: "LAL Preset Ember Red Animation"
            options:
              - "none"
              - leaf_cloud
            initial: "none"
            icon: mdi:fire
          lal_preset_soft_day_animation:
            name: "LAL Preset Soft Day Animation"
            options:
              - "none"
              - leaf_cloud
            initial: "none"
            icon: mdi:white-balance-sunny
        input_number:
          lal_preset_starlight_blue_night_hue:
            name: "LAL Starlight Blue Night Hue"
            min: 0
            max: 360
            step: 1
            initial: 235
            mode: box
          lal_preset_starlight_blue_night_sat:
            name: "LAL Starlight Blue Night Saturation"
            min: 0
            max: 100
            step: 1
            initial: 85
            unit_of_measurement: "%"
            mode: box
          lal_preset_starlight_blue_night_bri_color:
