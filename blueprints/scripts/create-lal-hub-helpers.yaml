blueprint:
  homeassistant:
    min_version: 2025.5.3
  name: "[CDA] 🛋️ Create LAL Hub Helpers"
  description: >
    Create helpers for the Living Area Lighting Hub (global profile select).
    Requires shell_command.cda_write_living_area_lighting_helper_package.
  domain: script
  source_url: https://github.com/chatondearu/mirabelle-ha-blueprints/blob/main/blueprints/scripts/create-lal-hub-helpers.yaml
  input:
    package_filename:
      name: Package Filename
      default: cda_lal_hub_helpers.yaml
      selector:
        text: {}

mode: single
sequence:
  - variables:
      package_filename_value: !input package_filename
      probe_entity: input_select.cda_lal_global_profile
      package_exists: "{{ states(probe_entity) not in ['unknown', 'unavailable', ''] }}"
      package_b64: |
        {% set pkg -%}
        # Generated by [CDA] Create LAL Hub Helpers
        input_select:
          cda_lal_global_profile:
            name: LAL Global Profile
            options:
              - morning
              - day
              - evening
              - night
            initial: day
            icon: mdi:theme-light-dark
        {%- endset %}
        {{ pkg | base64_encode }}
  - if:
      - condition: template
        value_template: "{{ package_exists }}"
    then:
      - stop: LAL hub helpers already exist
    else:
      - service: shell_command.cda_write_living_area_lighting_helper_package
        data:
          package_filename: "{{ package_filename_value | string }}"
          content_b64: "{{ package_b64 | string }}"
        continue_on_error: true
      - service: homeassistant.reload_all
        continue_on_error: true
      - delay:
          seconds: 5
      - variables:
          ok: "{{ states(probe_entity) not in ['unknown', 'unavailable', ''] }}"
      - if:
          - condition: template
            value_template: "{{ ok }}"
        then:
          - service: persistent_notification.create
            data:
              title: "[CDA] LAL Hub Helpers"
              message: Created input_select.cda_lal_global_profile.
        else:
          - service: persistent_notification.create
            data:
              title: "[CDA] LAL Hub Helpers"
              message: >
                Failed to create hub helpers. Check
                shell_command.cda_write_living_area_lighting_helper_package.
