blueprint:
  homeassistant:
    min_version: 2025.5.3
  name: "[CDA] 🔢 Frient Keypad Fallback for Alarm Panels"
  description: >
    Forward Frient KEPZB-110 keypad commands from ZHA to CDA Alarm or another
    alarm_control_panel used as the single source of truth.

    Prefer the native CDA Alarm Frient binding by configuring frient_device_id.
    Use this blueprint only as a fallback when that binding is not configured;
    do not run both for the same keypad.

    PIN codes and RFID badges are validated by the target panel. When using
    CDA Alarm, manage them in the integration options.

    This blueprint never arms or disarms the Frient ZHA alarm panel. Optional,
    experimental feedback can push the target panel status to the keypad
    LEDs/buzzer via raw IAS ACE cluster commands. This is best-effort because
    ZHA does not fully implement the IAS ACE "central" role yet.

    Original blueprint by Darktoinon (Home Assistant community forum), adapted
    and maintained here.
  domain: automation
  input:
    devices:
      name: Devices
      icon: mdi:dialpad
      input:
        keypad:
          name: Frient Keypad
          description: >
            The Frient KEPZB-110 keypad (ZHA device).
          selector:
            device:
              integration: zha
        mirror_alarm_panel:
          name: Target Alarm Panel
          description: >
            The alarm panel used as the single source of truth. CDA Alarm is
            the default.
          default: alarm_control_panel.cda_alarm
          selector:
            entity:
              domain: alarm_control_panel
    codes:
      name: Codes
      icon: mdi:form-textbox-password
      input:
        mirror_default_pin:
          name: Default Code for Target Alarm
          description: >
            Fallback code used on the target panel when the keypad event does
            not carry a code.
          default: ""
          selector:
            text:
              type: password
    feedback:
      name: Keypad Feedback (experimental)
      icon: mdi:led-on
      input:
        enable_keypad_feedback:
          name: Enable Keypad LED/Buzzer Feedback
          description: >
            Push the alarm status back to the keypad via raw IAS ACE commands.
            Experimental and best-effort due to ZHA limitations; disabled by
            default. Never blocks arming/disarming if it fails.
          default: false
          selector:
            boolean:
        keypad_endpoint:
          name: Keypad IAS ACE Endpoint
          description: >
            Zigbee endpoint of the IAS ACE cluster on the keypad. On the
            KEPZB-110 this is typically 44 (visible in the zha_event
            `endpoint_id`). Adjust if your device differs.
          default: 44
          selector:
            number:
              min: 1
              max: 255
              mode: box

# The keypad forwards commands to the target panel. Target state changes are
# used only for optional keypad feedback; the Frient ZHA panel is never changed.
trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input keypad
      command: arm
    id: keypad_event

  - platform: state
    entity_id: !input mirror_alarm_panel
    id: mirror_state_change

variables:
  mirror_default_pin: !input mirror_default_pin
  enable_keypad_feedback: !input enable_keypad_feedback
  keypad_endpoint: !input keypad_endpoint
  keypad_device: !input keypad
  # ZHA stores the IEEE address as the device identifier ("zha", "xx:xx:..").
  keypad_ieee: >-
    {% set ids = device_attr(keypad_device, 'identifiers') | list %}
    {{ ids[0][1] if ids and ids[0] | count > 1 else '' }}

mode: single

action:
  - choose:
      # --- Keypad -> target alarm panel ---------------------------------------
      - conditions:
          - condition: trigger
            id: keypad_event
        sequence:
          # Code typed on the keypad, falling back to the configured default.
          # ZHA exposes arm_mode/code under `params` (with `args` left empty).
          - variables:
              keypad_arm_mode: "{{ trigger.event.data.params.arm_mode | default(-1) | int(-1) }}"
              keypad_code: >-
                {% set c = trigger.event.data.params.code | default('') %}
                {{ c if c != '' else mirror_default_pin }}
          - choose:
              # arm_mode 0 = disarm
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_arm_mode == 0 }}"
                sequence:
                  - service: alarm_control_panel.alarm_disarm
                    target:
                      entity_id: !input mirror_alarm_panel
                    data:
                      code: "{{ keypad_code }}"
              # arm_mode 1 = arm home
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_arm_mode == 1 }}"
                sequence:
                  - service: alarm_control_panel.alarm_arm_home
                    target:
                      entity_id: !input mirror_alarm_panel
                    data:
                      code: "{{ keypad_code }}"
              # arm_mode 2 = arm night
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_arm_mode == 2 }}"
                sequence:
                  - service: alarm_control_panel.alarm_arm_night
                    target:
                      entity_id: !input mirror_alarm_panel
                    data:
                      code: "{{ keypad_code }}"
              # arm_mode 3 = arm away
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_arm_mode == 3 }}"
                sequence:
                  - service: alarm_control_panel.alarm_arm_away
                    target:
                      entity_id: !input mirror_alarm_panel
                    data:
                      code: "{{ keypad_code }}"

      # --- Target panel -> optional keypad feedback ---------------------------
      - conditions:
          - condition: trigger
            id: mirror_state_change
        sequence:
          - variables:
              mirror_state: "{{ trigger.to_state.state }}"
          # Best-effort keypad LED/buzzer feedback via raw IAS ACE
          # panel_status_changed (cluster 0x0501 = 1281, command 0x04).
          # args = [panel_status, seconds_remaining, audible_notification,
          # alarm_status]. continue_on_error keeps the alarm working if ZHA
          # rejects the command.
          - if:
              - "{{ enable_keypad_feedback and keypad_ieee != '' }}"
            then:
              - service: zha.issue_zigbee_cluster_command
                continue_on_error: true
                data:
                  ieee: "{{ keypad_ieee }}"
                  endpoint_id: !input keypad_endpoint
                  cluster_id: 1281
                  cluster_type: out
                  command: 4
                  command_type: client
                  args:
                    - >-
                      {{ {'disarmed': 0, 'armed_home': 1, 'armed_night': 2,
                          'armed_away': 3, 'arming': 4, 'pending': 5,
                          'triggered': 7}.get(mirror_state, 6) }}
                    - 0
                    - "{{ 1 if mirror_state in ['arming', 'pending', 'triggered'] else 0 }}"
                    - 0
