blueprint:
  homeassistant:
    min_version: 2025.5.3
  name: "[CDA] 🛋️ Living Area Adaptive Lighting"
  description: >
    Adaptive lighting for living areas using computed profiles: morning, day,
    evening, and night. Supports shared profile presets (package helpers), optional
    brightness animations (leaf_cloud), and following a global lighting hub mode.
    Night mode applies per-lamp starlight on color lights and dim white lights, with
    an optional brightness ramp. Day/morning/evening warm color temperature from sun
    elevation and adjust brightness from illuminance and cover shading. Optional
    cover-open privacy (block or brightness cap). Profile boundaries support
    sunrise/sunset/elevation/fixed time with a postpone delay. Manual override can
    pause after hand control. Uses zone occupancy with optional person home constraints.
  domain: automation
  source_url: https://github.com/chatondearu/mirabelle-ha-blueprints/blob/main/blueprints/automations/living-area-adaptive-lighting.yaml
  input:
    lights_section:
      name: Lights
      icon: mdi:lightbulb-group
      description: Select color-capable and white-only lights separately.
      input:
        color_lights:
          name: Color Lights
          description: >
            Lights that support color (RGB/HS). Each lamp gets a stable night hue
            variation derived from its entity id.
          default: []
          selector:
            entity:
              domain: light
              multiple: true
        white_lights:
          name: White Lights
          description: White-only or dimmable white lights (no forced color at night).
          default: []
          selector:
            entity:
              domain: light
              multiple: true
    presence_section:
      name: Presence
      icon: mdi:motion-sensor
      description: Zone occupancy and optional home constraints.
      input:
        occupancy_sensors:
          name: Occupancy Sensors
          description: >
            Binary sensors for the living area (motion, mmWave, room occupied,
            or template helpers tied to a zone).
          selector:
            entity:
              domain: binary_sensor
              multiple: true
        presence_persons:
          name: Persons At Home
          description: >
            Optional person entities. Used when "Require Someone Home" is enabled.
          default: []
          selector:
            entity:
              domain: person
              multiple: true
        require_someone_home:
          name: Require Someone Home
          description: >
            When enabled and at least one person is selected, lighting only runs
            while someone is home.
          default: false
          selector:
            boolean: {}
        delay_off:
          name: Delay Before Turning Off
          description: >
            Seconds to wait after all occupancy sensors are off before turning off lights.
          default: 300
          selector:
            number:
              min: 0
              max: 3600
              unit_of_measurement: seconds
    ambient_section:
      name: Ambient Light
      icon: mdi:brightness-6
      description: Illuminance sensor and thresholds (hysteresis supported).
      input:
        illuminance_sensor:
          name: Illuminance Sensor
          description: >
            Optional lux sensor. When empty, profile windows and sun position drive
            lighting need.
          default: ""
          selector:
            entity:
              domain: sensor
        lux_dark:
          name: Lux Dark Threshold
          description: Turn lights on when illuminance is below this value (lux).
          default: 80
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx
        lux_bright:
          name: Lux Bright Threshold
          description: >
            Hysteresis high threshold (lux). Above this value, artificial light is
            usually not needed during the day unless covers are heavily closed.
          default: 120
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx
        lux_dark_covers_open:
          name: Lux Dark Threshold (Covers Open)
          description: >
            Optional stricter dark threshold when covers are open for privacy.
            Leave at 0 to reuse Lux Dark Threshold.
          default: 0
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx
        lux_bright_covers_open:
          name: Lux Bright Threshold (Covers Open)
          description: >
            Optional stricter bright threshold when covers are open. Leave at 0 to
            reuse Lux Bright Threshold.
          default: 0
          selector:
            number:
              min: 0
              max: 2000
              unit_of_measurement: lx
    schedule_section:
      name: Profile Schedule
      icon: mdi:calendar-clock
      description: >
        When each profile becomes active. Night is the late "night simulation"
        window; evening covers dusk until night; morning softens the start of day.
      input:
        night_start:
          name: Night Start (Fixed Time)
          description: >
            Fixed clock time for night when Night Trigger is fixed_time. Leave empty
            to fall back to sunset when using sun-based night, or to 22:00:00 when
            evening profile is enabled.
          default: ""
          selector:
            time: {}
        day_start:
          name: Night End / Morning Start (Fixed Time)
          description: >
            Fixed clock time when the night window ends (and morning may start when
            Morning Trigger is fixed_time). Leave empty to use sunrise.
          default: ""
          selector:
            time: {}
        night_trigger:
          name: Night Trigger
          description: Event that starts the night (simulation) profile.
          default: fixed_time
          selector:
            select:
              options:
                - label: Fixed time
                  value: fixed_time
                - label: Sunset
                  value: sunset
                - label: Sunrise
                  value: sunrise
                - label: Sun elevation
                  value: sun_elevation
        night_delay_minutes:
          name: Night Delay
          description: >
            Minutes to wait after the night trigger before night becomes active
            (negative = start earlier).
          default: 0
          selector:
            number:
              min: -180
              max: 180
              unit_of_measurement: minutes
        night_elevation:
          name: Night Elevation Threshold
          description: Sun elevation (degrees) used when Night Trigger is sun_elevation.
          default: -12
          selector:
            number:
              min: -18
              max: 5
              unit_of_measurement: "°"
        evening_enabled:
          name: Evening Profile Enabled
          description: >
            When enabled, the evening profile runs from the evening trigger until
            night start (fixes full day brightness after sunset when night is late).
          default: true
          selector:
            boolean: {}
        evening_trigger:
          name: Evening Trigger
          description: Event that starts the evening profile.
          default: sunset
          selector:
            select:
              options:
                - label: Sunset
                  value: sunset
                - label: Fixed time
                  value: fixed_time
                - label: Sun elevation
                  value: sun_elevation
        evening_fixed_time:
          name: Evening Fixed Time
          description: Used when Evening Trigger is fixed_time.
          default: "18:00:00"
          selector:
            time: {}
        evening_elevation:
          name: Evening Elevation Threshold
          description: >
            Sun elevation (degrees) at or below which evening starts when trigger is
            sun_elevation. Default 0 matches sunset.
          default: 0
          selector:
            number:
              min: -18
              max: 20
              unit_of_measurement: "°"
        evening_delay_minutes:
          name: Evening Delay
          description: Minutes after the evening trigger before evening is active.
          default: 0
          selector:
            number:
              min: -180
              max: 180
              unit_of_measurement: minutes
        morning_enabled:
          name: Morning Profile Enabled
          description: Soft morning profile after night ends, before full day.
          default: true
          selector:
            boolean: {}
        morning_trigger:
          name: Morning Trigger
          description: Event that starts the morning profile (also ends night).
          default: fixed_time
          selector:
            select:
              options:
                - label: Fixed time
                  value: fixed_time
                - label: Sunrise
                  value: sunrise
                - label: Sun elevation
                  value: sun_elevation
        morning_fixed_time:
          name: Morning Fixed Time
          description: >
            Used when Morning Trigger is fixed_time. Leave empty to reuse Night End
            / Morning Start (day_start), then sunrise.
          default: ""
          selector:
            time: {}
        morning_elevation:
          name: Morning Elevation Threshold
          description: Sun elevation (degrees) at or above which morning starts.
          default: -6
          selector:
            number:
              min: -18
              max: 30
              unit_of_measurement: "°"
        morning_delay_minutes:
          name: Morning Delay
          description: Minutes after the morning trigger before morning is active.
          default: 0
          selector:
            number:
              min: -180
              max: 180
              unit_of_measurement: minutes
        morning_duration_minutes:
          name: Morning Duration
          description: How long morning stays active after it starts.
          default: 180
          selector:
            number:
              min: 15
              max: 360
              unit_of_measurement: minutes
    covers_section:
      name: Covers
      icon: mdi:window-shutter
      description: Optional covers for shading and open-cover privacy.
      input:
        covers:
          name: Living Area Covers
          description: >
            Optional cover entities. Uses Home Assistant cover positions (0 = closed,
            100 = open). Mostly closed blinds increase artificial light need.
          default: []
          selector:
            entity:
              domain: cover
              multiple: true
        cover_shade_threshold:
          name: Cover Shade Threshold
          description: >
            Average closed amount (%) above which covers alone trigger lighting.
            Computed as 100 minus current_position (e.g. position 25 open = 75% closed).
          default: 60
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        cover_open_privacy_threshold:
          name: Cover Open Privacy Threshold
          description: >
            Average open position (%) at or above which open-cover privacy policy
            applies (e.g. 50 means mostly open).
          default: 50
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        open_covers_policy:
          name: Open Covers Privacy Policy
          description: >
            When covers are open above the privacy threshold: block lux-based lighting,
            cap brightness, or leave legacy behavior (off).
          default: block
          selector:
            select:
              options:
                - label: Block (do not light for low lux)
                  value: block
                - label: Cap brightness
                  value: cap
                - label: Off (legacy)
                  value: "off"
        open_covers_brightness_cap:
          name: Open Covers Brightness Cap
          description: Max brightness percent when policy is Cap and covers are open.
          default: 25
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
    night_profile_section:
      name: Night Profile
      icon: mdi:weather-night
      input:
        night_enabled:
          name: Night Profile Enabled
          default: true
          selector:
            boolean: {}
        night_preset:
          name: Night Preset
          description: >
            Shared preset for this mode only. Local uses the manual values in this
            section (including animation).
          default: local
          selector:

            select:
              options:
                - label: Local (manual config below)
                  value: local
                - label: Starlight Blue
                  value: starlight_blue
                - label: Ember Red
                  value: ember_red
                - label: Soft Day
                  value: soft_day

        night_animation_type:
          name: Night Animation
          description: Used when this mode preset is Local. Preset packs bring their own animation.
          default: "none"
          selector:
            select:
              options:
                - label: None
                  value: "none"
                - label: Leaf / cloud sway
                  value: leaf_cloud
        night_animation_amplitude:
          name: Night Animation Amplitude
          default: 8
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: "%"
        night_animation_period:
          name: Night Animation Period
          default: 75
          selector:
            number:
              min: 15
              max: 300
              unit_of_measurement: seconds
        night_hue_base:
          name: Night Hue Base
          description: Base hue for color lights (0-360). Blue night is around 235.
          default: 235
          selector:
            number:
              min: 0
              max: 360
        night_hue_spread:
          name: Night Hue Spread
          description: Per-lamp hue variation range (+/- spread) around the base hue.
          default: 15
          selector:
            number:
              min: 0
              max: 60
        night_saturation:
          name: Night Saturation
          description: Saturation for color lights at night (0-100).
          default: 85
          selector:
            number:
              min: 0
              max: 100
              unit_of_measurement: "%"
        night_brightness_color:
          name: Night Brightness (Color)
          description: Brightness percent for color lights at night.
          default: 40
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        night_brightness_white:
          name: Night Brightness (White)
          description: Brightness percent for white-only lights at night.
          default: 15
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        night_dim_enabled:
          name: Night Brightness Ramp
          description: >
            When enabled, night brightness starts high at night start and ramps
            down to the values above by the "Night Dim Until" time.
          default: false
          selector:
            boolean: {}
        night_brightness_high:
          name: Night Brightness Start (Ramp)
          description: >
            Starting brightness percent at night start when the ramp is enabled.
            Should be higher than the night brightness values above.
          default: 70
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        night_dim_until:
          name: Night Dim Until
          description: >
            Time when the night brightness ramp reaches its minimum (HH:MM:SS).
            Default is midnight.
          default: "00:00:00"
          selector:
            time: {}
    morning_profile_section:
      name: Morning Profile
      icon: mdi:weather-sunset-up
      description: Soft profile after night ends (before full day).
      input:
        morning_preset:
          name: Morning Preset
          description: >
            Shared preset for this mode only. Local uses the manual values in this
            section (including animation).
          default: local
          selector:

            select:
              options:
                - label: Local (manual config below)
                  value: local
                - label: Starlight Blue
                  value: starlight_blue
                - label: Ember Red
                  value: ember_red
                - label: Soft Day
                  value: soft_day

        morning_animation_type:
          name: Morning Animation
          description: Used when this mode preset is Local. Preset packs bring their own animation.
          default: "none"
          selector:
            select:
              options:
                - label: None
                  value: "none"
                - label: Leaf / cloud sway
                  value: leaf_cloud
        morning_animation_amplitude:
          name: Morning Animation Amplitude
          default: 5
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: "%"
        morning_animation_period:
          name: Morning Animation Period
          default: 90
          selector:
            number:
              min: 15
              max: 300
              unit_of_measurement: seconds
        morning_kelvin_min:
          name: Morning Kelvin Minimum
          description: Warmest morning color temperature.
          default: 2500
          selector:
            number:
              min: 2000
              max: 6500
              unit_of_measurement: K
        morning_kelvin_max:
          name: Morning Kelvin Maximum
          description: Coolest morning color temperature.
          default: 3500
          selector:
            number:
              min: 2000
              max: 6500
              unit_of_measurement: K
        morning_brightness_min:
          name: Morning Brightness Minimum
          description: Minimum brightness percent during morning.
          default: 25
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        morning_brightness_max:
          name: Morning Brightness Maximum
          description: Maximum brightness percent during morning.
          default: 70
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
    day_profile_section:
      name: Day Profile
      icon: mdi:white-balance-sunny
      input:
        day_enabled:
          name: Day Profile Enabled
          default: true
          selector:
            boolean: {}
        day_preset:
          name: Day Preset
          description: >
            Shared preset for this mode only. Local uses the manual values in this
            section (including animation).
          default: local
          selector:

            select:
              options:
                - label: Local (manual config below)
                  value: local
                - label: Starlight Blue
                  value: starlight_blue
                - label: Ember Red
                  value: ember_red
                - label: Soft Day
                  value: soft_day

        day_animation_type:
          name: Day Animation
          description: Used when this mode preset is Local. Preset packs bring their own animation.
          default: "none"
          selector:
            select:
              options:
                - label: None
                  value: "none"
                - label: Leaf / cloud sway
                  value: leaf_cloud
        day_animation_amplitude:
          name: Day Animation Amplitude
          default: 5
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: "%"
        day_animation_period:
          name: Day Animation Period
          default: 90
          selector:
            number:
              min: 15
              max: 300
              unit_of_measurement: seconds
        day_kelvin_min:
          name: Day Kelvin Minimum
          description: Warmest color temperature at low sun elevation.
          default: 2700
          selector:
            number:
              min: 2000
              max: 6500
              unit_of_measurement: K
        day_kelvin_max:
          name: Day Kelvin Maximum
          description: Coolest color temperature at high sun elevation (midday).
          default: 4000
          selector:
            number:
              min: 2000
              max: 6500
              unit_of_measurement: K
        day_brightness_min:
          name: Day Brightness Minimum
          description: Minimum brightness percent during the day profile.
          default: 35
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        day_brightness_max:
          name: Day Brightness Maximum
          description: Maximum brightness percent during the day profile.
          default: 100
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        cover_kelvin_warm_shift:
          name: Cover Kelvin Warm Shift
          description: >
            Kelvin subtracted at fully closed average cover position (warmer light).
          default: 300
          selector:
            number:
              min: 0
              max: 1000
              unit_of_measurement: K
    evening_profile_section:
      name: Evening Profile
      icon: mdi:weather-sunset-down
      description: >
        Dusk profile until night simulation starts. Prevents day-max brightness
        when night start is a late fixed time.
      input:
        evening_preset:
          name: Evening Preset
          description: >
            Shared preset for this mode only. Local uses the manual values in this
            section (including animation).
          default: local
          selector:

            select:
              options:
                - label: Local (manual config below)
                  value: local
                - label: Starlight Blue
                  value: starlight_blue
                - label: Ember Red
                  value: ember_red
                - label: Soft Day
                  value: soft_day

        evening_animation_type:
          name: Evening Animation
          description: Used when this mode preset is Local. Preset packs bring their own animation.
          default: "none"
          selector:
            select:
              options:
                - label: None
                  value: "none"
                - label: Leaf / cloud sway
                  value: leaf_cloud
        evening_animation_amplitude:
          name: Evening Animation Amplitude
          default: 6
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: "%"
        evening_animation_period:
          name: Evening Animation Period
          default: 90
          selector:
            number:
              min: 15
              max: 300
              unit_of_measurement: seconds
        evening_kelvin_min:
          name: Evening Kelvin Minimum
          description: Warmest evening color temperature.
          default: 2200
          selector:
            number:
              min: 1800
              max: 6500
              unit_of_measurement: K
        evening_kelvin_max:
          name: Evening Kelvin Maximum
          description: Coolest evening color temperature.
          default: 3000
          selector:
            number:
              min: 1800
              max: 6500
              unit_of_measurement: K
        evening_brightness_min:
          name: Evening Brightness Minimum
          description: Minimum brightness percent during evening.
          default: 25
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
        evening_brightness_max:
          name: Evening Brightness Maximum
          description: Maximum brightness percent during evening.
          default: 55
          selector:
            number:
              min: 1
              max: 100
              unit_of_measurement: "%"
    transition_section:
      name: Horizon Transition
      icon: mdi:weather-sunset
      description: >
        Optional progressive blend across a sun elevation band near the horizon.
      input:
        progressive_transition:
          name: Progressive Transition
          description: >
            When enabled and mode is auto, lights blend across the elevation band
            near the horizon. Outside the band, morning/day/evening/night profiles
            apply normally (evening after dusk until night start).
          default: false
          selector:
            boolean: {}
        transition_elevation_low:
          name: Transition Elevation Low
          description: >
            Sun elevation (degrees) at which the transition starts on the night
            side. Around -6 matches civil twilight.
          default: -6
          selector:
            number:
              min: -18
              max: 10
              unit_of_measurement: "°"
        transition_elevation_high:
          name: Transition Elevation High
          description: >
            Sun elevation (degrees) at which the transition completes into the day
            side of the band.
          default: 6
          selector:
            number:
              min: -10
              max: 30
              unit_of_measurement: "°"
        transition_warm_kelvin:
          name: Transition Warm Kelvin
          description: >
            Warmest color temperature at the horizon during the transition (golden
            hour). Blends toward the active day-side profile kelvin.
          default: 2200
          selector:
            number:
              min: 1500
              max: 4000
              unit_of_measurement: K

    hub_section:
      name: Lighting Hub
      icon: mdi:sitemap
      description: Optional shared schedule from the Living Area Lighting Hub.
      input:
        follow_global_profile:
          name: Follow Global Profile Hub
          description: >
            When enabled and room mode is auto, use input_select.cda_lal_global_profile
            from the Living Area Lighting Hub instead of this automation's schedule.
          default: false
          selector:
            boolean: {}
        global_profile_helper:
          name: Global Profile Helper
          description: input_select written by the lighting hub (default entity id).
          default: input_select.cda_lal_global_profile
          selector:
            entity:
              domain: input_select
    control_section:
      name: Manual Control
      icon: mdi:tune
      description: >
        Dashboard helpers (input_select / input_boolean). When enabled, the
        automation uses predictable entity ids from the slug below. Create helpers
        once with the companion script blueprint (see documentation).
      input:
        create_dashboard_helpers:
          name: Create Dashboard Control Helpers
          description: >
            When enabled, uses input_select.{slug}_mode and input_boolean.{slug}_hold.
            Create them once via the [CDA] Create Living Area Lighting Helpers script.
          default: true
          selector:
            boolean: {}
        control_helper_slug:
          name: Control Helper Slug
          description: >
            Base slug for auto-created helpers (letters, numbers, underscores).
            Example slug living_area_lighting creates input_select.living_area_lighting_mode.
          default: living_area_lighting
          selector:
            text: {}
        control_mode_helper_name:
          name: Mode Helper Display Name
          description: Friendly name for the auto-created mode dropdown helper.
          default: Living Area Lighting Mode
          selector:
            text: {}
        control_hold_helper_name:
          name: Hold Helper Display Name
          description: Friendly name for the auto-created hold toggle helper.
          default: Living Area Lighting Hold
          selector:
            text: {}
        manual_mode_helper:
          name: Manual Mode Helper Override
          description: >
            Optional existing input_select (options: auto, morning, day, evening,
            night, off). When set, overrides auto-created mode helper entity id.
          default: ""
          selector:
            entity:
              domain: input_select
        manual_hold_helper:
          name: Manual Hold Helper Override
          description: >
            Optional existing input_boolean. When set, overrides auto-created hold helper.
          default: ""
          selector:
            entity:
              domain: input_boolean
        manual_override_enabled:
          name: Manual Override Hold
          description: >
            When enabled, turning on at least one light of the group by hand
            (UI, app or voice) pauses the automation for the duration below, so it
            does not change or turn the lights off. Note: physical/Zigbee switch
            actions may not be detected as manual.
          default: false
          selector:
            boolean: {}
        manual_override_minutes:
          name: Manual Override Duration
          description: >
            How long the automation stays paused after a manual light change.
          default: 30
          selector:
            number:
              min: 1
              max: 1440
              unit_of_measurement: minutes
        transition_seconds:
          name: Light Transition
          description: Transition time in seconds for light changes.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              unit_of_measurement: seconds

mode: restart

trigger_variables:
  illuminance_sensor_input: !input illuminance_sensor
  lux_dark_input: !input lux_dark
  lux_bright_input: !input lux_bright
  manual_mode_helper_input: !input manual_mode_helper
  manual_hold_helper_input: !input manual_hold_helper
  create_dashboard_helpers_input: !input create_dashboard_helpers
  control_helper_slug_input: !input control_helper_slug
  control_mode_helper_name_input: !input control_mode_helper_name
  control_hold_helper_name_input: !input control_hold_helper_name
  presence_persons_input: !input presence_persons
  cover_entities_input: !input covers
  color_lights_input: !input color_lights
  white_lights_input: !input white_lights

trigger:
  - platform: state
    entity_id: !input occupancy_sensors
    to: "on"
  - platform: state
    entity_id: !input occupancy_sensors
    from: "on"
    to: "off"
    for:
      seconds: !input delay_off
  - platform: template
    value_template: >
      {% if illuminance_sensor_input | length > 0 and has_value(illuminance_sensor_input) %}
        {{ states(illuminance_sensor_input) | float(0) | round(1) }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if cover_entities_input | count > 0 %}
        {{ expand(cover_entities_input) | map(attribute='attributes.current_position') | join('|') }}
      {% else %}
        none
      {% endif %}
  - platform: sun
    event: sunrise
  - platform: sun
    event: sunset
  - platform: state
    entity_id: sun.sun
  - platform: template
    value_template: >
      {% if presence_persons_input | count > 0 %}
        {{ expand(presence_persons_input) | map(attribute='state') | join('|') }}
      {% else %}
        none
      {% endif %}
  - platform: time_pattern
    minutes: "/5"
  - platform: template
    value_template: >
      {% set group_lights = color_lights_input + white_lights_input %}
      {% if group_lights | count > 0 %}
        {{ expand(group_lights) | map(attribute='state') | join('|') }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if manual_mode_helper_input | length > 0 %}
        {{ states(manual_mode_helper_input) }}
      {% elif create_dashboard_helpers_input %}
        {{ states('input_select.' ~ (control_helper_slug_input | regex_replace('[^a-zA-Z0-9_]+', '_') | lower | regex_replace('^_+|_+$', '')) ~ '_mode') }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if manual_hold_helper_input | length > 0 %}
        {{ states(manual_hold_helper_input) }}
      {% elif create_dashboard_helpers_input %}
        {{ states('input_boolean.' ~ (control_helper_slug_input | regex_replace('[^a-zA-Z0-9_]+', '_') | lower | regex_replace('^_+|_+$', '')) ~ '_hold') }}
      {% else %}
        none
      {% endif %}

variables:
  color_light_entities: !input color_lights
  white_light_entities: !input white_lights
  occupancy_sensor_entities: !input occupancy_sensors
  presence_person_entities: !input presence_persons
  require_someone_home: !input require_someone_home
  illuminance_sensor_entity: !input illuminance_sensor
  lux_dark: !input lux_dark
  lux_bright: !input lux_bright
  lux_dark_covers_open: !input lux_dark_covers_open
  lux_bright_covers_open: !input lux_bright_covers_open
  night_start_input: !input night_start
  day_start_input: !input day_start
  night_trigger: !input night_trigger
  night_delay_minutes: !input night_delay_minutes
  night_elevation: !input night_elevation
  evening_enabled: !input evening_enabled
  evening_trigger: !input evening_trigger
  evening_fixed_time: !input evening_fixed_time
  evening_elevation: !input evening_elevation
  evening_delay_minutes: !input evening_delay_minutes
  morning_enabled: !input morning_enabled
  morning_trigger: !input morning_trigger
  morning_fixed_time: !input morning_fixed_time
  morning_elevation: !input morning_elevation
  morning_delay_minutes: !input morning_delay_minutes
  morning_duration_minutes: !input morning_duration_minutes
  cover_entities: !input covers
  cover_shade_threshold: !input cover_shade_threshold
  cover_open_privacy_threshold: !input cover_open_privacy_threshold
  open_covers_policy: !input open_covers_policy
  open_covers_brightness_cap: !input open_covers_brightness_cap
  night_hue_base: !input night_hue_base
  night_hue_spread: !input night_hue_spread
  night_saturation: !input night_saturation
  night_brightness_color: !input night_brightness_color
  night_brightness_white: !input night_brightness_white
  morning_kelvin_min: !input morning_kelvin_min
  morning_kelvin_max: !input morning_kelvin_max
  morning_brightness_min: !input morning_brightness_min
  morning_brightness_max: !input morning_brightness_max
  day_kelvin_min: !input day_kelvin_min
  day_kelvin_max: !input day_kelvin_max
  day_brightness_min: !input day_brightness_min
  day_brightness_max: !input day_brightness_max
  cover_kelvin_warm_shift: !input cover_kelvin_warm_shift
  evening_kelvin_min: !input evening_kelvin_min
  evening_kelvin_max: !input evening_kelvin_max
  evening_brightness_min: !input evening_brightness_min
  evening_brightness_max: !input evening_brightness_max
  night_dim_enabled: !input night_dim_enabled
  night_brightness_high: !input night_brightness_high
  night_dim_until_input: !input night_dim_until
  progressive_transition: !input progressive_transition
  transition_elevation_low: !input transition_elevation_low
  transition_elevation_high: !input transition_elevation_high
  transition_warm_kelvin: !input transition_warm_kelvin
  manual_override_enabled: !input manual_override_enabled
  manual_override_minutes: !input manual_override_minutes
  manual_mode_helper: !input manual_mode_helper
  manual_hold_helper: !input manual_hold_helper
  create_dashboard_helpers: !input create_dashboard_helpers
  control_helper_slug_input: !input control_helper_slug
  control_mode_helper_name: !input control_mode_helper_name
  control_hold_helper_name: !input control_hold_helper_name
  transition_seconds: !input transition_seconds
  follow_global_profile: !input follow_global_profile
  global_profile_helper: !input global_profile_helper
  night_enabled: !input night_enabled
  day_enabled: !input day_enabled
  night_preset: !input night_preset
  morning_preset: !input morning_preset
  day_preset: !input day_preset
  evening_preset: !input evening_preset
  night_animation_type: !input night_animation_type
  night_animation_amplitude: !input night_animation_amplitude
  night_animation_period: !input night_animation_period
  morning_animation_type: !input morning_animation_type
  morning_animation_amplitude: !input morning_animation_amplitude
  morning_animation_period: !input morning_animation_period
  day_animation_type: !input day_animation_type
  day_animation_amplitude: !input day_animation_amplitude
  day_animation_period: !input day_animation_period
  evening_animation_type: !input evening_animation_type
  evening_animation_amplitude: !input evening_animation_amplitude
  evening_animation_period: !input evening_animation_period
  control_helper_slug: >
    {{
      control_helper_slug_input
      | regex_replace('[^a-zA-Z0-9_]+', '_')
      | lower
      | regex_replace('^_+|_+$', '')
    }}
  mode_helper_entity: >
    {% if manual_mode_helper is string and manual_mode_helper | length > 0 %}
      {{ manual_mode_helper }}
    {% elif create_dashboard_helpers %}
      input_select.{{ control_helper_slug }}_mode
    {% else %}
    {% endif %}
  hold_helper_entity: >
    {% if manual_hold_helper is string and manual_hold_helper | length > 0 %}
      {{ manual_hold_helper }}
    {% elif create_dashboard_helpers %}
      input_boolean.{{ control_helper_slug }}_hold
    {% else %}
    {% endif %}
  mode_helper_exists: >
    {{
      mode_helper_entity is string
      and mode_helper_entity | length > 0
      and states(mode_helper_entity) not in ['unknown', 'unavailable', '']
    }}
  hold_helper_exists: >
    {{
      hold_helper_entity is string
      and hold_helper_entity | length > 0
      and states(hold_helper_entity) not in ['unknown', 'unavailable', '']
    }}
  all_light_entities: "{{ color_light_entities + white_light_entities }}"
  has_color_lights: "{{ color_light_entities | count > 0 }}"
  has_white_lights: "{{ white_light_entities | count > 0 }}"
  has_any_lights: "{{ all_light_entities | count > 0 }}"
  any_light_on: >
    {{
      expand(all_light_entities)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0
    }}
  has_illuminance_sensor: >
    {{
      illuminance_sensor_entity is string
      and illuminance_sensor_entity | length > 0
      and has_value(illuminance_sensor_entity)
    }}
  has_covers: "{{ cover_entities | count > 0 }}"
  has_presence_persons: "{{ presence_person_entities | count > 0 }}"
  has_manual_mode_helper: "{{ mode_helper_exists }}"
  has_manual_hold_helper: "{{ hold_helper_exists }}"
  manual_hold_active: >
    {{ has_manual_hold_helper and is_state(hold_helper_entity, 'on') }}
  is_home: >
    {{
      expand(presence_person_entities)
      | selectattr('state', 'eq', 'home')
      | list
      | count > 0
    }}
  home_required_blocked: >
    {{
      require_someone_home
      and has_presence_persons
      and not is_home
    }}
  zone_occupied: >
    {{
      expand(occupancy_sensor_entities)
      | selectattr('state', 'eq', 'on')
      | list
      | count > 0
    }}
  current_lux: >
    {% if has_illuminance_sensor %}
      {{ states(illuminance_sensor_entity) | float(0) }}
    {% else %}
      0
    {% endif %}
  sun_elevation: "{{ state_attr('sun.sun', 'elevation') | float(0) }}"
  is_sun_up: "{{ is_state('sun.sun', 'above_horizon') }}"
  now_ts: "{{ as_timestamp(now()) }}"
  sunset_tod: >
    {{ as_local(as_datetime(state_attr('sun.sun', 'next_setting'))).strftime('%H:%M:%S') }}
  sunrise_tod: >
    {{ as_local(as_datetime(state_attr('sun.sun', 'next_rising'))).strftime('%H:%M:%S') }}
  has_night_start: "{{ night_start_input is string and night_start_input | length > 0 }}"
  has_night_end: "{{ day_start_input is string and day_start_input | length > 0 }}"
  has_morning_fixed: "{{ morning_fixed_time is string and morning_fixed_time | length > 0 }}"
  night_fixed_tod: >
    {% if has_night_start %}
      {{ night_start_input }}
    {% elif evening_enabled %}
      22:00:00
    {% else %}
      {{ sunset_tod }}
    {% endif %}
  morning_fixed_tod: >
    {% if has_morning_fixed %}
      {{ morning_fixed_time }}
    {% elif has_night_end %}
      {{ day_start_input }}
    {% else %}
      {{ sunrise_tod }}
    {% endif %}
  night_start_today_ts: >
    {% if night_trigger == 'sunset' %}
      {{ as_timestamp(today_at(sunset_tod)) + (night_delay_minutes | float(0) * 60) }}
    {% elif night_trigger == 'sunrise' %}
      {{ as_timestamp(today_at(sunrise_tod)) + (night_delay_minutes | float(0) * 60) }}
    {% else %}
      {{ as_timestamp(today_at(night_fixed_tod)) + (night_delay_minutes | float(0) * 60) }}
    {% endif %}
  morning_start_today_ts: >
    {% if morning_trigger == 'sunrise' %}
      {{ as_timestamp(today_at(sunrise_tod)) + (morning_delay_minutes | float(0) * 60) }}
    {% else %}
      {{ as_timestamp(today_at(morning_fixed_tod)) + (morning_delay_minutes | float(0) * 60) }}
    {% endif %}
  evening_start_today_ts: >
    {% if evening_trigger == 'fixed_time' %}
      {{ as_timestamp(today_at(evening_fixed_time)) + (evening_delay_minutes | float(0) * 60) }}
    {% else %}
      {{ as_timestamp(today_at(sunset_tod)) + (evening_delay_minutes | float(0) * 60) }}
    {% endif %}
  in_night_window: >
    {% if night_trigger == 'sun_elevation' %}
      {{ (sun_elevation | float(0)) <= (night_elevation | float(-12)) }}
    {% else %}
      {% set t = now_ts | float(0) %}
      {% set nstart = night_start_today_ts | float(0) %}
      {% set nend = morning_start_today_ts | float(0) %}
      {% if nend <= nstart %}
        {{ t >= nstart or t < nend }}
      {% else %}
        {{ t >= nstart and t < nend }}
      {% endif %}
    {% endif %}
  in_evening_window: >
    {% if not evening_enabled or in_night_window %}
      {{ false }}
    {% elif evening_trigger == 'sun_elevation' %}
      {{ (sun_elevation | float(0)) <= (evening_elevation | float(0)) }}
    {% else %}
      {% set t = now_ts | float(0) %}
      {% set estart = evening_start_today_ts | float(0) %}
      {% set nstart = night_start_today_ts | float(0) %}
      {% if nstart <= estart %}
        {{ t >= estart or t < nstart }}
      {% else %}
        {{ t >= estart and t < nstart }}
      {% endif %}
    {% endif %}
  in_morning_window: >
    {% if not morning_enabled or in_night_window or in_evening_window %}
      {{ false }}
    {% elif morning_trigger == 'sun_elevation' %}
      {{
        (sun_elevation | float(0)) >= (morning_elevation | float(-6))
        and (now_ts | float(0)) < ((morning_start_today_ts | float(0))
             + (morning_duration_minutes | float(180) * 60))
      }}
    {% else %}
      {% set t = now_ts | float(0) %}
      {% set mstart = morning_start_today_ts | float(0) %}
      {% set mend = mstart + (morning_duration_minutes | float(180) * 60) %}
      {{ t >= mstart and t < mend }}
    {% endif %}
  effective_mode: >
    {% if has_manual_mode_helper %}
      {{ states(mode_helper_entity) }}
    {% else %}
      auto
    {% endif %}
  scheduled_profile: >
    {% if in_night_window and night_enabled %}
      night
    {% elif in_evening_window and evening_enabled %}
      evening
    {% elif in_morning_window and morning_enabled %}
      morning
    {% elif day_enabled %}
      day
    {% else %}
      day
    {% endif %}
  hub_profile: >
    {% if follow_global_profile
          and global_profile_helper is string
          and global_profile_helper | length > 0
          and states(global_profile_helper) not in ['unknown', 'unavailable', ''] %}
      {{ states(global_profile_helper) }}
    {% else %}
      {{ scheduled_profile }}
    {% endif %}
  active_profile: >
    {% if effective_mode in ['morning', 'day', 'evening', 'night'] %}
      {{ effective_mode }}
    {% elif effective_mode == 'off' %}
      off
    {% elif follow_global_profile and hub_profile in ['morning', 'day', 'evening', 'night'] %}
      {{ hub_profile }}
    {% else %}
      {{ scheduled_profile }}
    {% endif %}
  # Preset selected for the active mode (local = manual values in that section).
  active_mode_preset: >
    {% if active_profile == 'night' %}
      {{ night_preset }}
    {% elif active_profile == 'morning' %}
      {{ morning_preset }}
    {% elif active_profile == 'evening' %}
      {{ evening_preset }}
    {% else %}
      {{ day_preset }}
    {% endif %}
  active_preset_prefix: >
    {% if active_mode_preset != 'local' %}
      lal_preset_{{ active_mode_preset }}
    {% else %}
    {% endif %}
  # Per-mode resolved values (each mode uses its own preset or local config).
  eff_night_hue: >
    {% if night_preset == 'local' %}{{ night_hue_base }}
    {% else %}{{ states('input_number.lal_preset_' ~ night_preset ~ '_night_hue') | float(night_hue_base) }}{% endif %}
  eff_night_sat: >
    {% if night_preset == 'local' %}{{ night_saturation }}
    {% else %}{{ states('input_number.lal_preset_' ~ night_preset ~ '_night_sat') | float(night_saturation) }}{% endif %}
  eff_night_bri_color: >
    {% if night_preset == 'local' %}{{ night_brightness_color }}
    {% else %}{{ states('input_number.lal_preset_' ~ night_preset ~ '_night_bri_color') | float(night_brightness_color) }}{% endif %}
  eff_night_bri_white: >
    {% if night_preset == 'local' %}{{ night_brightness_white }}
    {% else %}{{ states('input_number.lal_preset_' ~ night_preset ~ '_night_bri_white') | float(night_brightness_white) }}{% endif %}
  eff_morning_kelvin_min: >
    {% if morning_preset == 'local' %}{{ morning_kelvin_min }}
    {% else %}{{ states('input_number.lal_preset_' ~ morning_preset ~ '_morning_kelvin_min') | float(morning_kelvin_min) }}{% endif %}
  eff_morning_kelvin_max: >
    {% if morning_preset == 'local' %}{{ morning_kelvin_max }}
    {% else %}{{ states('input_number.lal_preset_' ~ morning_preset ~ '_morning_kelvin_max') | float(morning_kelvin_max) }}{% endif %}
  eff_morning_bri_min: >
    {% if morning_preset == 'local' %}{{ morning_brightness_min }}
    {% else %}{{ states('input_number.lal_preset_' ~ morning_preset ~ '_morning_bri_min') | float(morning_brightness_min) }}{% endif %}
  eff_morning_bri_max: >
    {% if morning_preset == 'local' %}{{ morning_brightness_max }}
    {% else %}{{ states('input_number.lal_preset_' ~ morning_preset ~ '_morning_bri_max') | float(morning_brightness_max) }}{% endif %}
  eff_day_kelvin_min: >
    {% if day_preset == 'local' %}{{ day_kelvin_min }}
    {% else %}{{ states('input_number.lal_preset_' ~ day_preset ~ '_day_kelvin_min') | float(day_kelvin_min) }}{% endif %}
  eff_day_kelvin_max: >
    {% if day_preset == 'local' %}{{ day_kelvin_max }}
    {% else %}{{ states('input_number.lal_preset_' ~ day_preset ~ '_day_kelvin_max') | float(day_kelvin_max) }}{% endif %}
  eff_day_bri_min: >
    {% if day_preset == 'local' %}{{ day_brightness_min }}
    {% else %}{{ states('input_number.lal_preset_' ~ day_preset ~ '_day_bri_min') | float(day_brightness_min) }}{% endif %}
  eff_day_bri_max: >
    {% if day_preset == 'local' %}{{ day_brightness_max }}
    {% else %}{{ states('input_number.lal_preset_' ~ day_preset ~ '_day_bri_max') | float(day_brightness_max) }}{% endif %}
  eff_evening_kelvin_min: >
    {% if evening_preset == 'local' %}{{ evening_kelvin_min }}
    {% else %}{{ states('input_number.lal_preset_' ~ evening_preset ~ '_evening_kelvin_min') | float(evening_kelvin_min) }}{% endif %}
  eff_evening_kelvin_max: >
    {% if evening_preset == 'local' %}{{ evening_kelvin_max }}
    {% else %}{{ states('input_number.lal_preset_' ~ evening_preset ~ '_evening_kelvin_max') | float(evening_kelvin_max) }}{% endif %}
  eff_evening_bri_min: >
    {% if evening_preset == 'local' %}{{ evening_brightness_min }}
    {% else %}{{ states('input_number.lal_preset_' ~ evening_preset ~ '_evening_bri_min') | float(evening_brightness_min) }}{% endif %}
  eff_evening_bri_max: >
    {% if evening_preset == 'local' %}{{ evening_brightness_max }}
    {% else %}{{ states('input_number.lal_preset_' ~ evening_preset ~ '_evening_bri_max') | float(evening_brightness_max) }}{% endif %}
  # Animation follows the active mode's preset or that mode's local animation fields.
  eff_animation_type: >
    {% if active_mode_preset == 'local' %}
      {% if active_profile == 'night' %}{{ night_animation_type }}
      {% elif active_profile == 'morning' %}{{ morning_animation_type }}
      {% elif active_profile == 'evening' %}{{ evening_animation_type }}
      {% else %}{{ day_animation_type }}{% endif %}
    {% else %}
      {% set eid = 'input_select.' ~ active_preset_prefix ~ '_animation' %}
      {% if states(eid) not in ['unknown', 'unavailable', ''] %}
        {{ states(eid) }}
      {% else %}
        none
      {% endif %}
    {% endif %}
  eff_animation_amplitude: >
    {% if active_mode_preset == 'local' %}
      {% if active_profile == 'night' %}{{ night_animation_amplitude }}
      {% elif active_profile == 'morning' %}{{ morning_animation_amplitude }}
      {% elif active_profile == 'evening' %}{{ evening_animation_amplitude }}
      {% else %}{{ day_animation_amplitude }}{% endif %}
    {% else %}
      {{ states('input_number.' ~ active_preset_prefix ~ '_anim_amplitude') | float(8) }}
    {% endif %}
  eff_animation_period: >
    {% if active_mode_preset == 'local' %}
      {% if active_profile == 'night' %}{{ night_animation_period }}
      {% elif active_profile == 'morning' %}{{ morning_animation_period }}
      {% elif active_profile == 'evening' %}{{ evening_animation_period }}
      {% else %}{{ day_animation_period }}{% endif %}
    {% else %}
      {{ states('input_number.' ~ active_preset_prefix ~ '_anim_period') | float(75) }}
    {% endif %}
  animation_allowed_now: >
    {{ eff_animation_type not in ['none', ''] and active_profile in ['morning', 'day', 'evening', 'night'] }}
  cover_open_factor: >
    {% if has_covers %}
      {% set positions = expand(cover_entities) | map(attribute='attributes.current_position') | reject('none') | list %}
      {% if positions | count > 0 %}
        {{ (positions | sum / positions | count) | round(1) }}
      {% else %}
        0
      {% endif %}
    {% else %}
      0
    {% endif %}
  cover_closed_factor: >
    {% if has_covers %}
      {{ (100 - (cover_open_factor | float(0))) | round(1) }}
    {% else %}
      0
    {% endif %}
  covers_open_for_privacy: >
    {{
      has_covers
      and (cover_open_factor | float(0) >= cover_open_privacy_threshold | float(50))
    }}
  privacy_block_active: >
    {{ covers_open_for_privacy and open_covers_policy == 'block' }}
  privacy_cap_active: >
    {{ covers_open_for_privacy and open_covers_policy == 'cap' }}
  effective_lux_dark: >
    {% if covers_open_for_privacy and (lux_dark_covers_open | float(0) > 0) %}
      {{ lux_dark_covers_open }}
    {% else %}
      {{ lux_dark }}
    {% endif %}
  effective_lux_bright: >
    {% if covers_open_for_privacy and (lux_bright_covers_open | float(0) > 0) %}
      {{ lux_bright_covers_open }}
    {% else %}
      {{ lux_bright }}
    {% endif %}
  lux_needs_light: >
    {% if has_illuminance_sensor and not privacy_block_active %}
      {{ current_lux | float(0) < effective_lux_dark | float(0) }}
    {% else %}
      {{ false }}
    {% endif %}
  covers_need_light: >
    {{ has_covers and (cover_closed_factor | float(0) >= cover_shade_threshold | float(0)) }}
  need_artificial_light: >
    {{
      active_profile == 'night'
      or (
        not privacy_block_active
        and (
          active_profile == 'evening'
          or lux_needs_light
          or covers_need_light
          or (
            has_illuminance_sensor
            and zone_occupied
            and (current_lux | float(0) < effective_lux_bright | float(0))
            and (cover_closed_factor | float(0) >= (cover_shade_threshold | float(0) * 0.5))
          )
        )
      )
    }}
  use_night_profile: "{{ active_profile == 'night' }}"
  use_morning_profile: "{{ active_profile == 'morning' }}"
  use_evening_profile: "{{ active_profile == 'evening' }}"
  use_day_profile: "{{ active_profile == 'day' }}"
  day_kelvin: >
    {% set elev = [sun_elevation | float(0), 0] | max %}
    {% set elev_clamped = [elev, 45] | min %}
    {% set ratio = elev_clamped / 45 %}
    {% set kmin = eff_day_kelvin_min | float(day_kelvin_min) %}
    {% set kmax = eff_day_kelvin_max | float(day_kelvin_max) %}
    {% set base = (kmax - ((kmax - kmin) * (1 - ratio))) | int %}
    {% set warm_shift = (cover_closed_factor | float(0) / 100) * (cover_kelvin_warm_shift | float(0)) %}
    {{ [base - warm_shift, kmin] | max | int }}
  morning_kelvin: >
    {% set elev = [sun_elevation | float(0), 0] | max %}
    {% set elev_clamped = [elev, 45] | min %}
    {% set ratio = elev_clamped / 45 %}
    {% set kmin = eff_morning_kelvin_min | float(morning_kelvin_min) %}
    {% set kmax = eff_morning_kelvin_max | float(morning_kelvin_max) %}
    {% set base = (kmax - ((kmax - kmin) * (1 - ratio))) | int %}
    {% set warm_shift = (cover_closed_factor | float(0) / 100) * (cover_kelvin_warm_shift | float(0)) %}
    {{ [base - warm_shift, kmin] | max | int }}
  evening_kelvin: >
    {% set elev = [sun_elevation | float(0), 0] | max %}
    {% set elev_clamped = [elev, 45] | min %}
    {% set ratio = elev_clamped / 45 %}
    {% set kmin = eff_evening_kelvin_min | float(evening_kelvin_min) %}
    {% set kmax = eff_evening_kelvin_max | float(evening_kelvin_max) %}
    {% set base = (kmax - ((kmax - kmin) * (1 - ratio))) | int %}
    {% set warm_shift = (cover_closed_factor | float(0) / 100) * (cover_kelvin_warm_shift | float(0)) %}
    {{ [base - warm_shift, kmin] | max | int }}
  day_brightness_raw: >
    {% set bright = effective_lux_bright | float(120) %}
    {% set bmin = eff_day_bri_min | float(day_brightness_min) %}
    {% set bmax = eff_day_bri_max | float(day_brightness_max) %}
    {% if has_illuminance_sensor and bright > 0 %}
      {% set lux_ratio = 1 - ([current_lux | float(0), bright] | min / bright) %}
      {% set lux_brightness = bmin + ((bmax - bmin) * lux_ratio) %}
    {% else %}
      {% set lux_brightness = (bmin + bmax) / 2 %}
    {% endif %}
    {% set cover_boost = (cover_closed_factor | float(0) / 100) * (bmax - bmin) * 0.35 %}
    {{ [[lux_brightness + cover_boost, bmax] | min, bmin] | max | round(0) | int }}
  morning_brightness_raw: >
    {% set bright = effective_lux_bright | float(120) %}
    {% set bmin = eff_morning_bri_min | float(morning_brightness_min) %}
    {% set bmax = eff_morning_bri_max | float(morning_brightness_max) %}
    {% if has_illuminance_sensor and bright > 0 %}
      {% set lux_ratio = 1 - ([current_lux | float(0), bright] | min / bright) %}
      {% set lux_brightness = bmin + ((bmax - bmin) * lux_ratio) %}
    {% else %}
      {% set lux_brightness = (bmin + bmax) / 2 %}
    {% endif %}
    {% set cover_boost = (cover_closed_factor | float(0) / 100) * (bmax - bmin) * 0.35 %}
    {{ [[lux_brightness + cover_boost, bmax] | min, bmin] | max | round(0) | int }}
  evening_brightness_raw: >
    {% set bright = effective_lux_bright | float(120) %}
    {% set bmin = eff_evening_bri_min | float(evening_brightness_min) %}
    {% set bmax = eff_evening_bri_max | float(evening_brightness_max) %}
    {% if has_illuminance_sensor and bright > 0 %}
      {% set lux_ratio = 1 - ([current_lux | float(0), bright] | min / bright) %}
      {% set lux_brightness = bmin + ((bmax - bmin) * lux_ratio) %}
    {% else %}
      {% set lux_brightness = (bmin + bmax) / 2 %}
    {% endif %}
    {% set cover_boost = (cover_closed_factor | float(0) / 100) * (bmax - bmin) * 0.35 %}
    {{ [[lux_brightness + cover_boost, bmax] | min, bmin] | max | round(0) | int }}
  day_brightness_pct: >
    {% set raw = day_brightness_raw | int(50) %}
    {% if privacy_cap_active %}
      {{ [raw, open_covers_brightness_cap | int(25)] | min }}
    {% else %}
      {{ raw }}
    {% endif %}
  morning_brightness_pct: >
    {% set raw = morning_brightness_raw | int(40) %}
    {% if privacy_cap_active %}
      {{ [raw, open_covers_brightness_cap | int(25)] | min }}
    {% else %}
      {{ raw }}
    {% endif %}
  evening_brightness_pct: >
    {% set raw = evening_brightness_raw | int(40) %}
    {% if privacy_cap_active %}
      {{ [raw, open_covers_brightness_cap | int(25)] | min }}
    {% else %}
      {{ raw }}
    {% endif %}
  profile_kelvin: >
    {% if use_morning_profile %}
      {{ morning_kelvin }}
    {% elif use_evening_profile %}
      {{ evening_kelvin }}
    {% else %}
      {{ day_kelvin }}
    {% endif %}
  profile_brightness_pct: >
    {% if use_morning_profile %}
      {{ morning_brightness_pct }}
    {% elif use_evening_profile %}
      {{ evening_brightness_pct }}
    {% else %}
      {{ day_brightness_pct }}
    {% endif %}
  night_dim_factor: >
    {% if not night_dim_enabled %}
      {{ 0.0 }}
    {% else %}
      {% set start_ts = night_start_today_ts | float(0) %}
      {% set until_ts = as_timestamp(today_at(night_dim_until_input)) %}
      {% if until_ts <= start_ts %}{% set until_ts = until_ts + 86400 %}{% endif %}
      {% set t = now_ts | float(0) %}
      {% if t < start_ts %}{% set t = t + 86400 %}{% endif %}
      {% if t <= start_ts %}
        {{ 1.0 }}
      {% elif t >= until_ts %}
        {{ 0.0 }}
      {% else %}
        {{ (1.0 - (t - start_ts) / (until_ts - start_ts)) | round(3) }}
      {% endif %}
    {% endif %}
  transition_progress: >
    {% set lo = transition_elevation_low | float(-6) %}
    {% set hi = transition_elevation_high | float(6) %}
    {% set e = sun_elevation | float(0) %}
    {% if hi <= lo %}
      {{ 1.0 }}
    {% else %}
      {{ [[(e - lo) / (hi - lo), 1.0] | min, 0.0] | max | round(3) }}
    {% endif %}
  transition_active: >
    {{
      progressive_transition
      and effective_mode == 'auto'
      and (sun_elevation | float(0) > (transition_elevation_low | float(-6)))
      and (sun_elevation | float(0) < (transition_elevation_high | float(6)))
      and active_profile != 'night'
    }}
  transition_kelvin: >
    {% set p = transition_progress | float(0) %}
    {% set warm = transition_warm_kelvin | float(2200) %}
    {{ (warm + (profile_kelvin | float(0) - warm) * p) | round(0) | int }}
  transition_brightness_pct: >
    {% set p = transition_progress | float(0) %}
    {% set nb = night_brightness_color | float(40) %}
    {% set db = profile_brightness_pct | float(55) %}
    {% set raw = [[(nb + (db - nb) * p) | round(0) | int, 100] | min, 1] | max %}
    {% if privacy_cap_active %}
      {{ [raw, open_covers_brightness_cap | int(25)] | min }}
    {% else %}
      {{ raw }}
    {% endif %}
  manual_override_active: >
    {% if not manual_override_enabled %}
      {{ false }}
    {% else %}
      {% set win = (manual_override_minutes | float(30)) * 60 %}
      {% set ns = namespace(active=false) %}
      {% for e in all_light_entities %}
        {% set s = states[e] %}
        {% if s is not none and s.state == 'on'
              and s.context is not none and s.context.user_id is not none
              and (now() - s.last_changed).total_seconds() < win %}
          {% set ns.active = true %}
        {% endif %}
      {% endfor %}
      {{ ns.active }}
    {% endif %}

action:
  - if:
      - condition: template
        value_template: >
          {{ not manual_hold_active and not manual_override_active and has_any_lights }}
    then:
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{
                    any_light_on
                    and (
                      effective_mode == 'off'
                      or home_required_blocked
                      or not zone_occupied
                    )
                  }}
            sequence:
              - service: light.turn_off
                target:
                  entity_id: "{{ all_light_entities }}"
                data:
                  transition: "{{ transition_seconds }}"
          - conditions:
              - condition: template
                value_template: >
                  {{
                    zone_occupied
                    and not home_required_blocked
                    and need_artificial_light
                    and use_night_profile
                    and not transition_active
                  }}
            sequence:
              - repeat:
                  for_each: "{{ color_light_entities }}"
                  sequence:
                    - variables:
                        light_seed: "{{ repeat.item }}"
                        seed_sum: >
                          {% set ns = namespace(v=0) %}
                          {% for ch in light_seed %}
                            {% set ns.v = ns.v + ch | ord %}
                          {% endfor %}
                          {{ ns.v }}
                        hue_offset: >
                          {% set spread = night_hue_spread | int(0) %}
                          {% if spread > 0 %}
                            {{ (seed_sum | int(0)) % (spread * 2 + 1) - spread }}
                          {% else %}
                            0
                          {% endif %}
                        sat_offset: "{{ (seed_sum | int(0)) % 11 - 5 }}"
                        brightness_offset: "{{ (seed_sum | int(0)) % 15 - 7 }}"
                        night_base_color: >
                          {{ (eff_night_bri_color | float(0))
                             + ((night_brightness_high | float(0)) - (eff_night_bri_color | float(0)))
                             * (night_dim_factor | float(0)) }}
                        lamp_hue: >
                          {{ ((eff_night_hue | int(0)) + (hue_offset | int(0)) + 360) % 360 }}
                        lamp_sat: >
                          {{ [[(eff_night_sat | int(0)) + (sat_offset | int(0)), 100] | min, 0] | max }}
                        anim_delta: >
                          {% if animation_allowed_now and eff_animation_type == 'leaf_cloud' %}
                            {% set amp = eff_animation_amplitude | float(8) %}
                            {% set period = [eff_animation_period | float(75), 15] | max %}
                            {% set phase = (now_ts | float(0) / period) + ((seed_sum | int(0)) % 100) / 15.0 %}
                            {{ (sin(phase) * amp + 0.35 * sin(phase * 2.17) * amp) | round(1) }}
                          {% else %}
                            0
                          {% endif %}
                        lamp_brightness_pct: >
                          {{ [[(night_base_color | round(0) | int) + (brightness_offset | int(0)) + (anim_delta | float(0)) | round(0) | int, 100] | min, 1] | max }}
                        lamp_transition: >
                          {% if animation_allowed_now and eff_animation_type == 'leaf_cloud' %}
                            {{ [transition_seconds | int(3), 4] | max }}
                          {% else %}
                            {{ transition_seconds }}
                          {% endif %}
                    - service: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        hs_color:
                          - "{{ lamp_hue | int }}"
                          - "{{ lamp_sat | int }}"
                        brightness_pct: "{{ lamp_brightness_pct | int }}"
                        transition: "{{ lamp_transition | int }}"
              - repeat:
                  for_each: "{{ white_light_entities }}"
                  sequence:
                    - variables:
                        light_seed: "{{ repeat.item }}"
                        seed_sum: >
                          {% set ns = namespace(v=0) %}
                          {% for ch in light_seed %}
                            {% set ns.v = ns.v + ch | ord %}
                          {% endfor %}
                          {{ ns.v }}
                        brightness_offset: "{{ (seed_sum | int(0)) % 9 - 4 }}"
                        night_base_white: >
                          {{ (eff_night_bri_white | float(0))
                             + ((night_brightness_high | float(0)) - (eff_night_bri_white | float(0)))
                             * (night_dim_factor | float(0)) }}
                        anim_delta: >
                          {% if animation_allowed_now and eff_animation_type == 'leaf_cloud' %}
                            {% set amp = eff_animation_amplitude | float(8) %}
                            {% set period = [eff_animation_period | float(75), 15] | max %}
                            {% set phase = (now_ts | float(0) / period) + ((seed_sum | int(0)) % 100) / 15.0 %}
                            {{ (sin(phase) * amp + 0.35 * sin(phase * 2.17) * amp) | round(1) }}
                          {% else %}
                            0
                          {% endif %}
                        lamp_brightness_pct: >
                          {{ [[(night_base_white | round(0) | int) + (brightness_offset | int(0)) + (anim_delta | float(0)) | round(0) | int, 100] | min, 1] | max }}
                        lamp_transition: >
                          {% if animation_allowed_now and eff_animation_type == 'leaf_cloud' %}
                            {{ [transition_seconds | int(3), 4] | max }}
                          {% else %}
                            {{ transition_seconds }}
                          {% endif %}
                    - service: light.turn_on
                      target:
                        entity_id: "{{ repeat.item }}"
                      data:
                        brightness_pct: "{{ lamp_brightness_pct | int }}"
                        transition: "{{ lamp_transition | int }}"
          - conditions:
              - condition: template
                value_template: >
                  {{
                    zone_occupied
                    and not home_required_blocked
                    and need_artificial_light
                    and transition_active
                  }}
            sequence:
              - repeat:
                  for_each: "{{ all_light_entities }}"
                  sequence:
                    - variables:
                        supports_color_temp: >
                          {{
                            'color_temp'
                            in (state_attr(repeat.item, 'supported_color_modes') or [])
                          }}
                    - if:
                        - condition: template
                          value_template: "{{ supports_color_temp }}"
                      then:
                        - service: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            color_temp_kelvin: "{{ transition_kelvin | int }}"
                            brightness_pct: "{{ transition_brightness_pct | int }}"
                            transition: "{{ transition_seconds }}"
                      else:
                        - service: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            brightness_pct: "{{ transition_brightness_pct | int }}"
                            transition: "{{ transition_seconds }}"
          - conditions:
              - condition: template
                value_template: >
                  {{
                    zone_occupied
                    and not home_required_blocked
                    and need_artificial_light
                    and active_profile in ['morning', 'day', 'evening']
                    and not transition_active
                  }}
            sequence:
              - repeat:
                  for_each: "{{ all_light_entities }}"
                  sequence:
                    - variables:
                        supports_color_temp: >
                          {{
                            'color_temp'
                            in (state_attr(repeat.item, 'supported_color_modes') or [])
                          }}
                        light_seed: "{{ repeat.item }}"
                        seed_sum: >
                          {% set ns = namespace(v=0) %}
                          {% for ch in light_seed %}
                            {% set ns.v = ns.v + ch | ord %}
                          {% endfor %}
                          {{ ns.v }}
                        anim_delta: >
                          {% if animation_allowed_now and eff_animation_type == 'leaf_cloud' %}
                            {% set amp = eff_animation_amplitude | float(8) %}
                            {% set period = [eff_animation_period | float(75), 15] | max %}
                            {% set phase = (now_ts | float(0) / period) + ((seed_sum | int(0)) % 100) / 15.0 %}
                            {{ (sin(phase) * amp + 0.35 * sin(phase * 2.17) * amp) | round(1) }}
                          {% else %}
                            0
                          {% endif %}
                        lamp_brightness_pct: >
                          {{ [[(profile_brightness_pct | int) + (anim_delta | float(0)) | round(0) | int, 100] | min, 1] | max }}
                        lamp_transition: >
                          {% if animation_allowed_now and eff_animation_type == 'leaf_cloud' %}
                            {{ [transition_seconds | int(3), 4] | max }}
                          {% else %}
                            {{ transition_seconds }}
                          {% endif %}
                    - if:
                        - condition: template
                          value_template: "{{ supports_color_temp }}"
                      then:
                        - service: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            color_temp_kelvin: "{{ profile_kelvin | int }}"
                            brightness_pct: "{{ lamp_brightness_pct | int }}"
                            transition: "{{ lamp_transition | int }}"
                      else:
                        - service: light.turn_on
                          target:
                            entity_id: "{{ repeat.item }}"
                          data:
                            brightness_pct: "{{ lamp_brightness_pct | int }}"
                            transition: "{{ lamp_transition | int }}"
        default: []
