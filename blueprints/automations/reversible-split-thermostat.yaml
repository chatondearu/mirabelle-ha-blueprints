blueprint:
  homeassistant:
    min_version: 2025.5.3
  name: "[CDA] 🌡️ Reversible Split Thermostat"
  description: >
    Per-room thermostat for a reversible split connected to a shared heat pump
    (PAC). One instance per split. The global heat/cool/off mode comes from a
    single resolved mode helper (see the [CDA] HVAC Season Manager blueprint):
    this automation only applies that mode, it never decides heat vs cool, so
    every split always runs the same mode and the PAC is never asked to heat and
    cool at once.

    For its room it picks the comfort or eco setpoint from the schedule and
    presence, applies an away offset (subtracted in heat, added in cool), and
    idles the split (off, with optional heat frost protection) when a window is
    open, the target is already reached, or the outdoor temperature makes
    conditioning useless.
  domain: automation
  source_url: https://github.com/chatondearu/mirabelle-ha-blueprints/blob/main/blueprints/automations/reversible-split-thermostat.yaml
  input:
    climate_section:
      name: Split
      icon: mdi:air-conditioner
      input:
        climate_entity:
          name: Split (climate)
          description: The reversible split to control for this room.
          selector:
            entity:
              domain: climate
        room_temperature_sensor:
          name: Room Temperature Sensor
          description: Temperature sensor used to evaluate this room.
          selector:
            entity:
              domain: sensor
    mode_section:
      name: Global Mode
      icon: mdi:hvac
      input:
        hvac_active_helper:
          name: Resolved Mode Helper
          description: >
            input_select (options: off, heat, cool) written by the HVAC Season
            Manager. Use the same helper for every split so they stay in sync.
          selector:
            entity:
              domain: input_select
    setpoints_section:
      name: Setpoints
      icon: mdi:thermometer
      description: >
        Two shared helpers. Their meaning follows the active mode: in heat, eco is
        lower than comfort; in cool, eco is higher than comfort. The Season
        Manager can reset their values on each season change.
      input:
        comfort_helper:
          name: Comfort Setpoint Helper
          selector:
            entity:
              domain: input_number
        eco_helper:
          name: Eco Setpoint Helper
          selector:
            entity:
              domain: input_number
    schedule_section:
      name: Schedule & Presence
      icon: mdi:calendar-clock
      input:
        schedulers:
          name: Comfort Schedules
          description: >
            Optional schedule entities. Comfort is used while any schedule is on,
            otherwise eco. When empty, comfort is used at all times.
          default: []
          selector:
            entity:
              domain: schedule
              multiple: true
        persons:
          name: Persons
          description: >
            Optional person entities. When set and nobody is home, the away
            offset is applied.
          default: []
          selector:
            entity:
              domain: person
              multiple: true
        vacation_boolean:
          name: Vacation / Away Toggle
          description: >
            Optional input_boolean. When on, the away offset is applied
            regardless of presence.
          default: ""
          selector:
            entity:
              domain: input_boolean
        away_offset:
          name: Away Offset
          description: >
            Degrees applied when away. Subtracted from the target in heat, added
            in cool.
          default: 3
          selector:
            number:
              min: 0
              max: 10
              step: 0.5
              unit_of_measurement: "°C"
        presence_delay:
          name: Presence Delay
          description: >
            Seconds the presence state must be stable before reacting, to avoid
            reacting to brief comings and goings.
          default: 120
          selector:
            number:
              min: 0
              max: 1800
              unit_of_measurement: seconds
    night_section:
      name: Night / Sleep Override
      icon: mdi:bed
      description: >
        Optional, ideal for bedrooms. While the night schedule is on, a dedicated
        night setpoint is used instead of comfort/eco (e.g. 21 in summer, 17 in
        winter at night, eco during the day). Leave empty to disable.
      input:
        night_schedule:
          name: Night Schedule
          description: >
            Optional schedule entities. The night override is active while any of
            them is on (e.g. a bedtime schedule).
          default: []
          selector:
            entity:
              domain: schedule
              multiple: true
        night_setpoint_helper:
          name: Night Setpoint Helper
          description: >
            input_number used as the night target. Preferred way: the HVAC Season
            Manager can reset it per season (heat vs cool). Leave empty to use the
            fixed fallback below.
          default: ""
          selector:
            entity:
              domain: input_number
        night_setpoint:
          name: Night Setpoint (fixed fallback)
          description: >
            Fixed night target used only when no Night Setpoint Helper is set.
            0 disables the night override (not seasonal).
          default: 0
          selector:
            number:
              min: 0
              max: 32
              step: 0.5
              unit_of_measurement: "°C"
    safety_section:
      name: Idle & Safety
      icon: mdi:shield-home
      input:
        windows:
          name: Window / Door Sensors
          description: >
            Optional opening sensors. While any is open, the split is turned off.
          default: []
          selector:
            entity:
              domain: binary_sensor
              multiple: true
        room_sensor_control:
          name: Room Sensor Control (bang-bang)
          description: >
            Trust the room sensor instead of the split internal sensor. While the
            room needs conditioning, the split is driven beyond the target (see
            Boost Offset) to force full power, then turned fully off once the room
            sensor reaches the target. When disabled, the split keeps the plain
            target and regulates itself.
          default: true
          selector:
            boolean: {}
        boost_offset:
          name: Boost Offset
          description: >
            Degrees added (heat) or subtracted (cool) to the split target while
            conditioning, to overcome an inaccurate internal sensor and heat/cool
            hard. Only used when Room Sensor Control is on. 0 = drive at target.
          default: 2
          selector:
            number:
              min: 0
              max: 6
              step: 0.5
              unit_of_measurement: "°C"
        cut_hysteresis:
          name: Cut Hysteresis
          description: >
            Deadband around the target to avoid rapid on/off (protects the PAC).
            With Room Sensor Control on, the split restarts only after the room
            drops this far below target (heat) or rises this far above (cool).
          default: 0.3
          selector:
            number:
              min: 0
              max: 3
              step: 0.1
              unit_of_measurement: "°C"
        frost_protection_temp:
          name: Frost Protection (heat)
          description: >
            In heat mode, keep this minimum target instead of turning fully off
            when idle and the room drops to or below this value. Set to 0 to
            disable.
          default: 7
          selector:
            number:
              min: 0
              max: 15
              step: 0.5
              unit_of_measurement: "°C"
        outdoor_temperature:
          name: Outdoor Temperature Sensor
          description: Optional sensor used for the seasonal idle thresholds below.
          default: ""
          selector:
            entity:
              domain: sensor
        heat_outdoor_threshold:
          name: Heat — Outdoor Above Idle
          description: >
            In heat mode, do not heat when the outdoor temperature is at or above
            this value.
          default: 20
          selector:
            number:
              min: 0
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
        cool_outdoor_threshold:
          name: Cool — Outdoor Below Idle
          description: >
            In cool mode, do not cool when the outdoor temperature is at or below
            this value.
          default: 18
          selector:
            number:
              min: 0
              max: 40
              step: 0.5
              unit_of_measurement: "°C"
    tuning_section:
      name: Compressor Protection & Tuning
      icon: mdi:engine
      input:
        min_run_time:
          name: Minimum Run Time
          description: >
            Once started, keep the split on at least this long before it may be
            turned off because the target is reached (anti short-cycle, protects
            the compressor). 0 disables. An open window or a global Off still stop
            it immediately.
          default: 0
          selector:
            number:
              min: 0
              max: 1800
              unit_of_measurement: seconds
        adaptive_boost:
          name: Adaptive Boost
          description: >
            Reduce the boost offset progressively as the room approaches the
            target, for a soft landing and less overshoot. When off, the full
            boost offset is applied until the split is stopped.
          default: true
          selector:
            boolean: {}
        adaptive_boost_span:
          name: Adaptive Boost Span
          description: >
            Distance from the target over which the boost ramps from full to
            zero. Full boost applies while the room is farther than this from the
            target. Only used when Adaptive Boost is on.
          default: 2
          selector:
            number:
              min: 0.5
              max: 6
              step: 0.5
              unit_of_measurement: "°C"
        approach_max_delta:
          name: Max Approach Delta
          description: >
            Limits how aggressively the split is driven when the room is far from
            the target. The setpoint sent to the split will stay within this many
            degrees of the current room temperature (below the room in cool, above
            in heat), but never overshoot the logical target. Applied after the
            boost offset. 0 disables.
          default: 2
          selector:
            number:
              min: 0
              max: 6
              step: 0.5
              unit_of_measurement: "°C"
        sync_zigbee_occupied_setpoints:
          name: Sync Zigbee Occupied Setpoints
          description: >
            For ZHA splits (e.g. Atlantic / Fujitsu adapter), also write the
            device occupied cooling/heating setpoint when sending a temperature.
            Keeps the internal Zigbee target aligned with the HA command and
            avoids drift after using the IR remote. Ignored when the climate
            entity is not a ZHA device. Disable only if this causes issues.
          default: true
          selector:
            boolean: {}

mode: restart

trigger_variables:
  schedulers_input: !input schedulers
  persons_input: !input persons
  windows_input: !input windows
  outdoor_temperature_input: !input outdoor_temperature
  vacation_boolean_input: !input vacation_boolean
  night_schedule_input: !input night_schedule
  night_setpoint_helper_input: !input night_setpoint_helper

trigger:
  - platform: state
    entity_id: !input hvac_active_helper
  - platform: state
    entity_id: !input comfort_helper
  - platform: state
    entity_id: !input eco_helper
  - platform: state
    entity_id: !input room_temperature_sensor
  - platform: state
    entity_id: !input climate_entity
    to: ~
  - platform: template
    value_template: >
      {% if schedulers_input | count > 0 %}
        {{ expand(schedulers_input) | map(attribute='state') | join('|') }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if persons_input | count > 0 %}
        {{ expand(persons_input) | selectattr('state', 'eq', 'home') | list | count > 0 }}
      {% else %}
        none
      {% endif %}
    for:
      seconds: !input presence_delay
  - platform: template
    value_template: >
      {% if windows_input | count > 0 %}
        {{ expand(windows_input) | selectattr('state', 'eq', 'on') | list | count > 0 }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if outdoor_temperature_input | length > 0 %}
        {{ states(outdoor_temperature_input) }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if vacation_boolean_input | length > 0 %}
        {{ states(vacation_boolean_input) }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if night_schedule_input | count > 0 %}
        {{ expand(night_schedule_input) | map(attribute='state') | join('|') }}
      {% else %}
        none
      {% endif %}
  - platform: template
    value_template: >
      {% if night_setpoint_helper_input | length > 0 %}
        {{ states(night_setpoint_helper_input) }}
      {% else %}
        none
      {% endif %}
  - platform: homeassistant
    event: start

variables:
  climate_entity: !input climate_entity
  room_temperature_sensor: !input room_temperature_sensor
  hvac_active_helper: !input hvac_active_helper
  comfort_helper: !input comfort_helper
  eco_helper: !input eco_helper
  schedulers: !input schedulers
  persons: !input persons
  vacation_boolean: !input vacation_boolean
  away_offset: !input away_offset
  windows: !input windows
  night_schedule: !input night_schedule
  night_setpoint_helper: !input night_setpoint_helper
  night_setpoint: !input night_setpoint
  room_sensor_control: !input room_sensor_control
  boost_offset: !input boost_offset
  cut_hysteresis: !input cut_hysteresis
  frost_protection_temp: !input frost_protection_temp
  outdoor_temperature: !input outdoor_temperature
  heat_outdoor_threshold: !input heat_outdoor_threshold
  cool_outdoor_threshold: !input cool_outdoor_threshold
  min_run_time: !input min_run_time
  adaptive_boost: !input adaptive_boost
  adaptive_boost_span: !input adaptive_boost_span
  approach_max_delta: !input approach_max_delta
  sync_zigbee_occupied_setpoints: !input sync_zigbee_occupied_setpoints
  # Keep mode as the only cross-variable flag. Do NOT store is_heat/is_cool as
  # separate rendered variables: HA stringifies them to "True"/"False", and the
  # non-empty string "False" is truthy in Jinja `{% if is_cool %}` tests.
  mode: "{{ states(hvac_active_helper) | trim }}"
  room_available: "{{ has_value(room_temperature_sensor) }}"
  room_temp: >
    {{ states(room_temperature_sensor) | float(0) if has_value(room_temperature_sensor) else 0 }}
  comfort: "{{ states(comfort_helper) | float(20) }}"
  eco: "{{ states(eco_helper) | float(17) }}"
  comfort_active: >
    {{ schedulers | count == 0
       or (expand(schedulers) | selectattr('state', 'eq', 'on') | list | count > 0) }}
  someone_home: >
    {{ persons | count > 0
       and (expand(persons) | selectattr('state', 'eq', 'home') | list | count > 0) }}
  vacation_on: >
    {{ vacation_boolean | length > 0 and is_state(vacation_boolean, 'on') }}
  away: >
    {{ (persons | count > 0
        and not (expand(persons) | selectattr('state', 'eq', 'home') | list | count > 0))
       or (vacation_boolean | length > 0 and is_state(vacation_boolean, 'on')) }}
  night_schedule_on: >
    {{ night_schedule | count > 0
       and (expand(night_schedule) | selectattr('state', 'eq', 'on') | list | count > 0) }}
  night_helper_set: >
    {{ night_setpoint_helper | length > 0 and has_value(night_setpoint_helper) }}
  night_value: >
    {{ states(night_setpoint_helper) | float(0)
       if (night_setpoint_helper | length > 0 and has_value(night_setpoint_helper))
       else (night_setpoint | float(0)) }}
  night_active: >
    {{ night_schedule | count > 0
       and (expand(night_schedule) | selectattr('state', 'eq', 'on') | list | count > 0)
       and ((night_setpoint_helper | length > 0 and has_value(night_setpoint_helper))
            or (night_setpoint | float(0)) > 0) }}
  base_target: >
    {% set night_on = night_schedule | count > 0
       and (expand(night_schedule) | selectattr('state', 'eq', 'on') | list | count > 0)
       and ((night_setpoint_helper | length > 0 and has_value(night_setpoint_helper))
            or (night_setpoint | float(0)) > 0) %}
    {% set night_val = states(night_setpoint_helper) | float(0)
       if (night_setpoint_helper | length > 0 and has_value(night_setpoint_helper))
       else (night_setpoint | float(0)) %}
    {% set comfort_on = schedulers | count == 0
       or (expand(schedulers) | selectattr('state', 'eq', 'on') | list | count > 0) %}
    {{ night_val if night_on else (comfort if comfort_on else eco) }}
  target_raw: >
    {% set is_away = (persons | count > 0
        and not (expand(persons) | selectattr('state', 'eq', 'home') | list | count > 0))
       or (vacation_boolean | length > 0 and is_state(vacation_boolean, 'on')) %}
    {% set offset = away_offset | float(0) if is_away else 0 %}
    {% if mode == 'cool' %}
      {{ base_target | float(0) + offset }}
    {% else %}
      {{ base_target | float(0) - offset }}
    {% endif %}
  min_temp: "{{ state_attr(climate_entity, 'min_temp') | float(7) }}"
  max_temp: "{{ state_attr(climate_entity, 'max_temp') | float(35) }}"
  target: >
    {{ [[target_raw | float(0), min_temp | float(7)] | max, max_temp | float(35)] | min | round(1) }}
  currently_active: >
    {{ states(climate_entity) not in ['off', 'unknown', 'unavailable'] }}
  boost_effective: >
    {% set b = boost_offset | float(0) %}
    {% set room_ok = has_value(room_temperature_sensor) %}
    {% if not room_sensor_control or b <= 0 %}
      0
    {% elif not adaptive_boost or not room_ok %}
      {{ b }}
    {% else %}
      {% set span = [adaptive_boost_span | float(0), 0.1] | max %}
      {% set error = ((room_temp | float(0)) - (target | float(0)))
         if mode == 'cool'
         else ((target | float(0)) - (room_temp | float(0))) %}
      {% set ratio = [[error / span, 1] | min, 0] | max %}
      {{ (b * ratio) | round(2) }}
    {% endif %}
  drive_target_raw: >
    {% if mode == 'cool' %}
      {{ target | float(0) - (boost_effective | float(0)) }}
    {% else %}
      {{ target | float(0) + (boost_effective | float(0)) }}
    {% endif %}
  hyst: "{{ cut_hysteresis | float(0) }}"
  # demand is only for traces/debug; should_idle recomputes it natively below.
  demand: >
    {% set room_ok = has_value(room_temperature_sensor) %}
    {% set active = states(climate_entity) not in ['off', 'unknown', 'unavailable'] %}
    {% set h = cut_hysteresis | float(0) %}
    {% set tgt = target | float(0) %}
    {% set rt = room_temp | float(0) %}
    {% if not room_ok %}
      true
    {% elif mode == 'heat' %}
      {% if rt <= tgt - h %}true{% elif rt >= tgt %}false{% else %}{{ active }}{% endif %}
    {% elif mode == 'cool' %}
      {% if rt >= tgt + h %}true{% elif rt <= tgt %}false{% else %}{{ active }}{% endif %}
    {% else %}
      false
    {% endif %}
  drive_target_capped: >
    {% set raw = drive_target_raw | float(0) %}
    {% set delta = approach_max_delta | float(0) %}
    {% set tgt = target | float(0) %}
    {% set room_ok = has_value(room_temperature_sensor) %}
    {% set active = states(climate_entity) not in ['off', 'unknown', 'unavailable'] %}
    {% set h = cut_hysteresis | float(0) %}
    {% set rt = room_temp | float(0) %}
    {% set ns = namespace(needs=false) %}
    {% if not room_ok %}
      {% set ns.needs = true %}
    {% elif mode == 'heat' %}
      {% set ns.needs = true if rt <= tgt - h else (false if rt >= tgt else active) %}
    {% elif mode == 'cool' %}
      {% set ns.needs = true if rt >= tgt + h else (false if rt <= tgt else active) %}
    {% endif %}
    {% if delta <= 0 or not room_ok or not ns.needs %}
      {{ raw }}
    {% elif mode == 'cool' %}
      {{ [[raw, rt - delta] | max, tgt] | min }}
    {% elif mode == 'heat' %}
      {{ [[raw, rt + delta] | min, tgt] | max }}
    {% else %}
      {{ raw }}
    {% endif %}
  drive_target: >
    {{ [[drive_target_capped | float(0), min_temp | float(7)] | max, max_temp | float(35)] | min | round(1) }}
  window_open: >
    {{ windows | count > 0
       and (expand(windows) | selectattr('state', 'eq', 'on') | list | count > 0) }}
  has_outdoor: >
    {{ outdoor_temperature | length > 0 and has_value(outdoor_temperature) }}
  outdoor_temp: >
    {{ states(outdoor_temperature) | float(0)
       if (outdoor_temperature | length > 0 and has_value(outdoor_temperature))
       else 0 }}
  outdoor_block: >
    {% set has_out = outdoor_temperature | length > 0 and has_value(outdoor_temperature) %}
    {% set out_t = states(outdoor_temperature) | float(0) if has_out else 0 %}
    {% if mode == 'heat' and has_out %}
      {{ out_t >= (heat_outdoor_threshold | float(20)) }}
    {% elif mode == 'cool' and has_out %}
      {{ out_t <= (cool_outdoor_threshold | float(18)) }}
    {% else %}
      false
    {% endif %}
  run_elapsed: >
    {% set active = states(climate_entity) not in ['off', 'unknown', 'unavailable'] %}
    {{ (as_timestamp(now()) - as_timestamp(states[climate_entity].last_changed))
       | int(0) if active else 0 }}
  min_run_block: >
    {% set active = states(climate_entity) not in ['off', 'unknown', 'unavailable'] %}
    {{ active
       and (min_run_time | int(0)) > 0
       and ((as_timestamp(now()) - as_timestamp(states[climate_entity].last_changed)) | int(0))
          < (min_run_time | int(0)) }}
  should_idle: >
    {% set win_open = windows | count > 0
       and (expand(windows) | selectattr('state', 'eq', 'on') | list | count > 0) %}
    {% set has_out = outdoor_temperature | length > 0 and has_value(outdoor_temperature) %}
    {% set out_t = states(outdoor_temperature) | float(0) if has_out else 0 %}
    {% set out_block = (mode == 'heat' and has_out and out_t >= (heat_outdoor_threshold | float(20)))
       or (mode == 'cool' and has_out and out_t <= (cool_outdoor_threshold | float(18))) %}
    {% set room_ok = has_value(room_temperature_sensor) %}
    {% set active = states(climate_entity) not in ['off', 'unknown', 'unavailable'] %}
    {% set h = cut_hysteresis | float(0) %}
    {% set tgt = target | float(0) %}
    {% set rt = room_temp | float(0) %}
    {% set ns = namespace(needs=false) %}
    {% if not room_ok %}
      {% set ns.needs = true %}
    {% elif mode == 'heat' %}
      {% set ns.needs = true if rt <= tgt - h else (false if rt >= tgt else active) %}
    {% elif mode == 'cool' %}
      {% set ns.needs = true if rt >= tgt + h else (false if rt <= tgt else active) %}
    {% endif %}
    {% set min_block = active
       and (min_run_time | int(0)) > 0
       and ((as_timestamp(now()) - as_timestamp(states[climate_entity].last_changed)) | int(0))
          < (min_run_time | int(0)) %}
    {{ win_open or out_block or (room_sensor_control and not ns.needs and not min_block) }}
  frost_active: >
    {% set win_open = windows | count > 0
       and (expand(windows) | selectattr('state', 'eq', 'on') | list | count > 0) %}
    {{ mode == 'heat'
       and (frost_protection_temp | float(0)) > 0
       and has_value(room_temperature_sensor)
       and (room_temp | float(0)) <= (frost_protection_temp | float(0))
       and not win_open }}
  zigbee_ieee: >-
    {% set dev = device_id(climate_entity) %}
    {% set ns = namespace(ieee='') %}
    {% if dev %}
      {% for ident in device_attr(dev, 'identifiers') %}
        {% if ident[0] == 'zha' %}
          {% set ns.ieee = ident[1] %}
        {% endif %}
      {% endfor %}
    {% endif %}
    {{ ns.ieee }}
  zigbee_sync_enabled: >
    {{ sync_zigbee_occupied_setpoints and (zigbee_ieee | length > 0) }}
  zigbee_setpoint_raw: "{{ (drive_target | float(0) * 100) | int }}"

action:
  - choose:
      # Global mode is off (or unknown): the split must be off.
      - conditions:
          - condition: template
            value_template: "{{ mode not in ['heat', 'cool'] }}"
        sequence:
          - service: climate.turn_off
            target:
              entity_id: !input climate_entity
      # Conditioning not needed for this room: idle the split.
      - conditions:
          - condition: template
            # Compare as string: rendered automation vars are always strings.
            value_template: "{{ should_idle in [true, 'True', True] }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ frost_active in [true, 'True', True] }}"
            then:
              - service: climate.set_temperature
                target:
                  entity_id: !input climate_entity
                data:
                  hvac_mode: heat
                  temperature: !input frost_protection_temp
              - if:
                  - condition: template
                    value_template: "{{ zigbee_sync_enabled in [true, 'True', True] }}"
                then:
                  # Keep both occupied setpoints aligned; Atlantic/Fujitsu units
                  # may re-report the stale opposite-mode value after ~30s.
                  - service: zha.set_zigbee_cluster_attribute
                    continue_on_error: true
                    data:
                      ieee: "{{ zigbee_ieee }}"
                      endpoint_id: 1
                      cluster_id: 513
                      cluster_type: in
                      attribute: 18
                      value: "{{ (frost_protection_temp | float(0) * 100) | int }}"
                  - service: zha.set_zigbee_cluster_attribute
                    continue_on_error: true
                    data:
                      ieee: "{{ zigbee_ieee }}"
                      endpoint_id: 1
                      cluster_id: 513
                      cluster_type: in
                      attribute: 17
                      value: "{{ (frost_protection_temp | float(0) * 100) | int }}"
            else:
              - service: climate.turn_off
                target:
                  entity_id: !input climate_entity
    # Conditioning needed: apply the global mode with the room target (boosted
    # beyond the target when room sensor control is enabled).
    default:
      - service: climate.set_temperature
        target:
          entity_id: !input climate_entity
        data:
          hvac_mode: "{{ mode }}"
          temperature: "{{ drive_target }}"
      - if:
          - condition: template
            value_template: "{{ zigbee_sync_enabled in [true, 'True', True] }}"
        then:
          # Write BOTH occupied setpoints. These adapters keep a leftover heating
          # setpoint (often 20°C) that otherwise overwrites cooling ~30s later.
          - service: zha.set_zigbee_cluster_attribute
            continue_on_error: true
            data:
              ieee: "{{ zigbee_ieee }}"
              endpoint_id: 1
              cluster_id: 513
              cluster_type: in
              attribute: 17
              value: "{{ zigbee_setpoint_raw }}"
          - service: zha.set_zigbee_cluster_attribute
            continue_on_error: true
            data:
              ieee: "{{ zigbee_ieee }}"
              endpoint_id: 1
              cluster_id: 513
              cluster_type: in
              attribute: 18
              value: "{{ zigbee_setpoint_raw }}"
