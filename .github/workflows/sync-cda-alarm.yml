name: Sync CDA Alarm to Sub-Repository

on:
  push:
    branches:
      - main
    paths:
      - "packages/cda-alarm/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare CDA Alarm for sub-repository
        run: |
          mkdir -p /tmp/cda-alarm-sync

          cp -r packages/cda-alarm/custom_components /tmp/cda-alarm-sync/
          # Never publish bytecode into the HACS repository
          find /tmp/cda-alarm-sync -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
          find /tmp/cda-alarm-sync -name '*.pyc' -delete 2>/dev/null || true

          cp packages/cda-alarm/hacs.json /tmp/cda-alarm-sync/
          cp packages/cda-alarm/README.md /tmp/cda-alarm-sync/

          if [ -f packages/cda-alarm/INSTALLATION.md ]; then
            cp packages/cda-alarm/INSTALLATION.md /tmp/cda-alarm-sync/
          fi
          if [ -f packages/cda-alarm/HACS_SETUP.md ]; then
            cp packages/cda-alarm/HACS_SETUP.md /tmp/cda-alarm-sync/
          fi
          if [ -f packages/cda-alarm/TESTING.md ]; then
            cp packages/cda-alarm/TESTING.md /tmp/cda-alarm-sync/
          fi
          if [ -f packages/cda-alarm/.gitignore ]; then
            cp packages/cda-alarm/.gitignore /tmp/cda-alarm-sync/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE /tmp/cda-alarm-sync/
          fi

      - name: Check if sub-repository exists
        id: check_repo
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            https://api.github.com/repos/chatondearu/myrabelle-hacs-cda-alarm)

          if [ "$response" = "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Clone sub-repository (handles empty repo)
        if: steps.check_repo.outputs.exists == 'true'
        run: |
          git clone https://${{ secrets.RELEASE_TOKEN }}@github.com/chatondearu/myrabelle-hacs-cda-alarm.git sub-repo || true

      - name: Initialize sub-repository
        if: steps.check_repo.outputs.exists == 'false'
        run: |
          mkdir -p sub-repo
          cd sub-repo
          git init
          git remote add origin https://${{ secrets.RELEASE_TOKEN }}@github.com/chatondearu/myrabelle-hacs-cda-alarm.git
          git checkout -b main || git checkout main

      - name: Sync files to sub-repository
        run: |
          cd sub-repo

          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true

          cp -r /tmp/cda-alarm-sync/* .

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          cd sub-repo

          git checkout main 2>/dev/null || git checkout -b main

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: sync from monorepo [skip ci]" || echo "No changes to commit"
            git push origin main || git push -u origin main
          else
            echo "No changes to commit"
          fi
